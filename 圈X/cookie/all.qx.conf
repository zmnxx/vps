# 联通 + 移动 Cookie 获取（合并版）
# 仓库：https://github.com/zmnxx/vps/tree/main/圈X/cookie
#
# 联通：打开联通 App → 首页流量/语音
# 移动：打开移动 App → 手机验证码登录
#
# 推荐订阅：
# https://raw.githubusercontent.com/zmnxx/vps/main/%E5%9C%88X/cookie/all.qx.conf
# 或 jsDelivr：
# https://cdn.jsdelivr.net/gh/zmnxx/vps@main/圈X/cookie/all.qx.conf

[rewrite_local]
# 中国联通
^https?:\/\/m\.client\.10010\.com\/.+\/smartwisdomCommon url script-request-header https://raw.githubusercontent.com/zmnxx/vps/main/%E5%9C%88X/cookie/china_unicom_cookie.js

# 中国移动
^https?:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/[LD]N\/(uam(onekey|randcode)login|realPersonAuthentication)\/autoLogin url script-request-body https://raw.githubusercontent.com/zmnxx/vps/main/%E5%9C%88X/cookie/china_mobile_cookie.js

[mitm]
hostname = m.client.10010.com, client.app.coc.10086.cn
